version: 2
project_name: starlink_exporter

before:
  hooks:
    - go mod tidy
    - go test ./...
builds:
  - main: ./cmd/starlink_exporter/main.go
    env:
      - CGO_ENABLED=0
    flags:
    - -mod=vendor
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - 7

archives:
  - name_template: >-
      {{- .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end -}}
    format_overrides:
      - goos: windows
        formats: [ 'zip' ]
    files:
      - none*

nfpms:
  - package_name: starlink-exporter
    file_name_template: '{{ .ConventionalFileName }}'
    formats:
      - deb
    maintainer: Brendan Bank <brendan@brendanbank.nl>
    homepage: https://github.com/brendanbank/starlink_exporter
    section: net
    priority: optional
    description: |-
      Prometheus exporter for Starlink metrics
      A Prometheus exporter that collects metrics from Starlink dishes
      including signal quality, obstruction data, alignment statistics,
      and power consumption.
    contents:
      - src: starlink-exporter.service
        dst: /lib/systemd/system/starlink-exporter.service
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/doc/starlink-exporter/LICENSE
      - src: README.md
        dst: /usr/share/doc/starlink-exporter/README.md
    scripts:
      postinstall: packaging/deb/postinstall.sh
      preremove: packaging/deb/preremove.sh
      postremove: packaging/deb/postremove.sh

checksum:
  name_template: 'checksums.txt'

release:
  footer: |
    ## Debian/Ubuntu Installation

    ### AMD64 (x86_64)
    ```bash
    wget https://github.com/brendanbank/starlink_exporter/releases/download/{{ .Tag }}/starlink-exporter_{{ .Version }}_amd64.deb
    sudo dpkg -i starlink-exporter_{{ .Version }}_amd64.deb
    ```

    ### ARM64 (64-bit ARM)
    ```bash
    wget https://github.com/brendanbank/starlink_exporter/releases/download/{{ .Tag }}/starlink-exporter_{{ .Version }}_arm64.deb
    sudo dpkg -i starlink-exporter_{{ .Version }}_arm64.deb
    ```

    ### ARMHF (Raspberry Pi)
    ```bash
    wget https://github.com/brendanbank/starlink_exporter/releases/download/{{ .Tag }}/starlink-exporter_{{ .Version }}_armhf.deb
    sudo dpkg -i starlink-exporter_{{ .Version }}_armhf.deb
    ```

    ### After Installation

    The service is enabled and started automatically. Check it with:
    ```bash
    sudo systemctl status starlink-exporter
    sudo journalctl -u starlink-exporter -f
    ```
